function fmt(n){ return n.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

let currentDate = "2026-11-19";
let selectedEmp = null;
let empMap = {};

function buildEmpMap(rows) {
  empMap = {};
  for (const r of rows) {
    if (!empMap[r.emp]) empMap[r.emp] = {total:0, count:0, rows:[]};
    empMap[r.emp].total += r.wt;
    empMap[r.emp].count++;
    empMap[r.emp].rows.push(r);
  }
  for (const k in empMap) empMap[k].total = +empMap[k].total.toFixed(2);
}

function renderHeroKpi(rows) {
  const totalWt = rows.reduce((s,r)=>s+r.wt,0);
  const empCount = Object.keys(empMap).length;
  const maxAging = rows.length ? Math.max(...rows.map(r=>r.aging)) : 0;
  document.getElementById('heroKpi').innerHTML = [
    {label:'총 장기재고', val:fmt(totalWt), unit:'ton', badge:'내수 180일+'},
    {label:'담당 영업사원', val:empCount, unit:'명', badge:'장기재고 보유'},
    {label:'총 항목 수', val:rows.length, unit:'건', badge:'전체'},
    {label:'최장 보유일수', val:maxAging, unit:'일', badge:'최고 aging'},
  ].map(k=>`
    <div class="hero-kpi">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-val">${k.val}<span class="kpi-unit">${k.unit}</span></div>
      <div class="kpi-badge">${k.badge}</div>
    </div>
  `).join('');
}

}

      <div class="detail-total-box">
        <div class="total-label">총 재고중량</div>
        <div class="total-val">${fmt(info.total)}<span class="total-unit"> ton</span></div>
      </div>
    </div>
    <div class="filter-bar">
      <span class="filter-label">필터</span>
      <select class="filter-select${detailFilter.fac?' active':''}" onchange="applyFilter('fac',this.value)">
        <option value="" disabled selected style="display:none">공장</option>
        ${selOpts(facOpts, detailFilter.fac)}
      </select>
      <select class="filter-select${detailFilter.prod?' active':''}" onchange="applyFilter('prod',this.value)">
        <option value="" disabled selected style="display:none">지종명</option>
        ${selOpts(prodOpts, detailFilter.prod)}
      </select>
      ${isAll?`<select class="filter-select${detailFilter.emp?' active':''}" onchange="applyFilter('emp',this.value)">
        <option value="" disabled selected style="display:none">영업사원</option>
        ${selOpts(empOpts, detailFilter.emp)}
      </select>`:''}
      <select class="filter-select${detailFilter.cust?' active':''}" onchange="applyFilter('cust',this.value)">
        <option value="" disabled selected style="display:none">거래선</option>
        ${selOpts(custOpts, detailFilter.cust)}
      </select>
      <select class="filter-select${detailFilter.bw?' active':''}" onchange="applyFilter('bw',this.value)">
        <option value="" disabled selected style="display:none">평량</option>
        ${selOpts(bwOpts, detailFilter.bw)}
      </select>
      <select class="filter-select${detailFilter.w?' active':''}" onchange="applyFilter('w',this.value)">
        <option value="" disabled selected style="display:none">가로</option>
        ${selOpts(wOpts, detailFilter.w)}
      </select>
      <select class="filter-select${detailFilter.bh?' active':''}" onchange="applyFilter('bh',this.value)">
        <option value="" disabled selected style="display:none">보유기한</option>
        ${selOpts(bhOpts, detailFilter.bh)}
      </select>
      ${isFiltered ? `<button class="filter-reset" onclick="resetFilter()">✕ 초기화</button>` : ''}
      <span class="filter-count">${rows.length}건 / ${fmt(+filtTotal.toFixed(2))} ton</span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>공장</th><th>지종명</th><th>색상</th>
            <th class="r">평량</th><th class="r">가로</th><th class="r">길이</th>
            <th>거래선</th>${isAll?'<th>영업사원</th>':''}<th>보유기한</th><th class="r">보유(일)</th><th class="r">재고중량(ton)</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length === 0
            ? `<tr><td colspan="11" style="text-align:center;padding:28px;color:var(--fg3)">해당 조건의 데이터가 없습니다</td></tr>`
            : rows.map((r,i) => `
            <tr>
              <td class="row-num">${i+1}</td>
              <td><span class="fac-chip">${r.fac}</span></td>
              <td class="prod-name">${r.prod}</td>
              <td style="color:var(--fg3)">${r.color === '-' ? '' : r.color}</td>
              <td class="r">${r.bw}</td>
              <td class="r">${r.w}</td>
              <td class="r">${r.len}</td>
              <td class="cust-name">${r.cust}</td>
              ${isAll?`<td style="color:var(--fg2);font-weight:600">${r.emp}</td>`:''}
              <td><span class="bh-tag bh-${r.bh?.replace('일이상','').replace('일미만','m')}">${r.bh||'-'}</span></td>
              <td class="r ${r.aging>=180?'aging-cell':r.aging>=90?'aging-cell mid':'aging-cell low'}">${r.aging}일</td>
              <td class="r">${fmt(r.wt)}</td>
            </tr>`).join('')}
        </tbody>
        <tfoot>
          <tr>
            <td colspan="${isAll?10:9}"><span class="foot-label">${isFiltered?'필터 합계':'합 계'}</span></td>
            <td></td>
            <td class="r">${fmt(+filtTotal.toFixed(2))}</td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

function applyFilter(key, val) {
  detailFilter[key] = val;
  renderDetail(selectedEmp);
}

function resetFilter() {
  detailFilter = { fac: '', prod: '', bh: '', cust: '', emp: '', bw: '', w: '' };
  renderDetail(selectedEmp);
}

function selectEmp(name) {
  selectedEmp = (selectedEmp === name) ? null : name;
  renderGrid();
  renderDetail(selectedEmp);
  if (selectedEmp) document.getElementById('detailPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function onDateChange(val) {
  currentDate = val;
  const rows = getRows(val);
  buildEmpMap(rows);
  renderHeroKpi(rows);
  renderGrid();
  renderDetail(selectedEmp);
}

// data.json 로드 (GitHub Pages 배포 시 실제 데이터 사용)
fetch('data.json')
  .then(r => r.json())
  .then(data => {
    // 60일이상
    BASE_ROWS = data.rows.filter(r => r.bh !== '60일미만');
    // 60일미만
    SHORT_ROWS = data.rows.filter(r => r.bh === '60일미만');
    // 날짜 업데이트
    if (data.date) {
      currentDate = data.date;
      const sel = document.getElementById('dateSelect');
      sel.innerHTML = `<option value="${data.date}">${data.date} (최신)</option>`;
    }
    onDateChange(currentDate);
  })
  .catch(() => {
    // data.json 없으면 더미 데이터로 실행
    onDateChange(currentDate);
  });
</script>
